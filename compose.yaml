services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////project/data/app.db
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/customer-inquiry
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - api_data:/project/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mailpit

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.6.4
    restart: unless-stopped
    env_file: .env
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # needed only for $env.INTERNAL_API_TOKEN in local demo
      N8N_SECURE_COOKIE: "false" # localhost HTTP demo only
      GENERIC_TIMEZONE: Europe/Vienna
      TZ: Europe/Vienna
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    # SMTP is reachable only within the Docker network.

volumes:
  api_data:
  n8n_data:
